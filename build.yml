name: Flet Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet
        run: |
          pip install --upgrade pip
          pip install flet

      - name: Build APK and App Bundle
        run: |
          python -m flet build apk main.py

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: App-Release-APK
          path: build/apk/
