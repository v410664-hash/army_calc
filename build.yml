name: Build Flet Android APK

on:
  push:
    branches: [ main, головний ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build APK using Flet Action
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          # Тут фіксуємо версію python для стабільності збірки
          runner-python-version: "3.11"
          bundled-python-version: "3.11"

      - name: Upload APK to Github Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: армійський-калькулятор-apk
          path: build/apk/*.apk
